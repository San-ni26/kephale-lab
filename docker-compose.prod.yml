version: '3.8'

services:
  # 1. NestJS Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kephale_user}:${POSTGRES_PASSWORD:-kephale_pass}@db:5432/${POSTGRES_DB:-kephale}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_secure_random_string}
      # You can add your AWS / MinIO S3 credentials here
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-supersecret}
      - AWS_S3_BUCKET_NAME=kephale-media
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kephale-net

  # 2. PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kephale_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kephale_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kephale}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kephale-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kephale_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis (Cache & BullMQ)
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - kephale-net

  # 4. MinIO (S3-Compatible Object Storage)
  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret}
    volumes:
      - miniodata:/data
    ports:
      # API Port (For the backend to upload files)
      - "9000:9000"
      # Dashboard Port (For you to view files visually)
      - "9001:9001"
    networks:
      - kephale-net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  kephale-net:
    driver: bridge
