services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kephale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kephale
      POSTGRES_PASSWORD: kephale_dev
      POSTGRES_DB: kephale_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kephale -d kephale_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kephale_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible local storage) ──────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: kephale_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kephale_admin
      MINIO_ROOT_PASSWORD: kephale_dev_secret
    ports:
      - '9000:9000'  # S3 API
      - '9001:9001'  # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── BullMQ Dashboard (Bull Board) ─────────────────────────────────────────────
  # Accessible at http://localhost:3000/queues in dev
  bullboard:
    image: deadly0/bull-board
    container_name: kephale_bullboard
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3000:3000'
    depends_on:
      - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
